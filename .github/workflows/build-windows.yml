name: Build Windows executable

# Builds a standalone Windows executable for Chess Studio with PyInstaller.
# - Runs on every push to main (and code PRs) to validate the build.
# - Manual runs via the "Run workflow" button (workflow_dispatch).
# - Pushing a tag like v1.0.0 also publishes the build as a GitHub Release.
#
# Stockfish binaries are NOT in the repo (too large for git); the workflow
# downloads the Windows build with download_stockfish.py before packaging.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # No paths filter here on purpose: GitHub applies push path filters to tag
    # pushes too, so a doc-only commit that gets tagged could silently skip the
    # release build. Path filtering lives on pull_request only (PRs never carry
    # tags), so tag releases always build.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on tag pushes

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download Stockfish (Windows)
        run: python download_stockfish.py --current

      - name: Verify Stockfish is present
        shell: pwsh
        run: |
          if (-not (Test-Path "engines/windows/stockfish.exe")) {
            Write-Error "engines/windows/stockfish.exe was not downloaded."
            exit 1
          }
          $size = (Get-Item "engines/windows/stockfish.exe").Length
          Write-Host "Stockfish size: $([math]::Round($size/1MB,1)) MB"

      - name: Smoke-test the source (offscreen, exercises the engine)
        run: python tests/smoke_test.py

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm chess_studio.spec

      - name: Smoke-test the built executable
        shell: pwsh
        run: |
          $exe = "dist/ChessStudio/ChessStudio.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }
          # Run the app's headless self-check: it exits 0 only if the bundled
          # Stockfish and opening data load and the engine actually replies.
          # A liveness check would not catch a broken bundle, because the app
          # degrades gracefully instead of crashing.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(90000)) {
            Stop-Process -Id $p.Id -Force
            Get-Process stockfish -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Error "Smoke test did not finish within 90s (startup crash or hang)."
            exit 1
          }
          $p.WaitForExit()
          $code = $p.ExitCode
          Get-Process stockfish -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 0) {
            Write-Host "Smoke test FAILED (exit $code). Error log:"
            if (Test-Path "dist/ChessStudio/smoke_error.log") {
              Get-Content "dist/ChessStudio/smoke_error.log"
            }
            exit 1
          }
          Write-Host "Smoke test passed: bundled engine + opening data verified."

      - name: Determine version label
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "main-$($env:GITHUB_SHA.Substring(0,7))"
          }
          Write-Host "version=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package into a zip
        shell: pwsh
        run: |
          $name = "ChessStudio-windows-x64-${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist/ChessStudio" -DestinationPath "$name.zip" -Force
          Get-Item "$name.zip" | ForEach-Object {
            Write-Host "Created $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
          }
          "ARTIFACT_ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessStudio-windows-x64-${{ steps.version.outputs.version }}
          path: ${{ env.ARTIFACT_ZIP }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          generate_release_notes: true
          body: |
            Standalone Windows build of Chess Studio (Stockfish 18 bundled, fully offline).

            **How to run:** download the zip, extract it, and run `ChessStudio\ChessStudio.exe`.
            No installation needed — the whole folder is the app.
